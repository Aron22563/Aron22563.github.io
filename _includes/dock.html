<canvas id="swarm" aria-hidden="true"></canvas>

<div class="dock" role="group" aria-label="Cursor agents">
  <span class="dots hide-sm" id="dots"></span>
  <span><b id="nAgents">0</b> agents</span>
  <span class="hide-sm"><b id="nLayers">0</b> / <b id="nDrawn">0</b> layers</span>
  <span class="sep hide-sm"></span>
  <input type="range" id="complexity" min="0" max="3" step="1" value="2" aria-label="Animation level" aria-valuetext="Full">
  <span class="lvl" id="lvl">Full</span>
  <button type="button" id="pause" class="primary">Pause</button>
  <button type="button" id="clear">Clear</button>
</div>
