# Site settings
title: Aron Tinkl
tagline: Personal portfolio and blog
description: >-
  Aron Tinkl: computer science student. Portfolio and blog on operating systems,
  low-level and graphics programming, and scripting.
url: "https://aron22563.github.io"
baseurl: ""
lang: en
timezone: Europe/Berlin

author:
  name: Aron Tinkl
github:
  username: Aron22563

# Content
permalink: /posts/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
